name: Deploy to SmarterASP.NET

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: windows-latest
    environment: production
    env:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore T3mmyvsa.csproj

      - name: Build release
        run: dotnet build T3mmyvsa.csproj --configuration Release --no-restore

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.1

      - name: Update database
        run: dotnet ef database update --context=AppDbContext --connection "${{ secrets.DB_CONNECTION_STRING }}" --project T3mmyvsa.csproj --configuration Release --no-build

      - name: Publish
        run: |
          dotnet publish T3mmyvsa.csproj --configuration Release --no-build --output ./release
          Remove-Item -Path ./release/BuildHost-* -Recurse -Force -ErrorAction SilentlyContinue

      - name: Deploy to SmarterASP.NET
        shell: pwsh
        env:
          WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $computerNameArgument = "$env:SERVER_COMPUTER_NAME/MsDeploy.axd?site=$env:WEBSITE_NAME"

          $msdeployArguments = @(
              "-verb:sync",
              "-source:contentPath=$pwd/release",
              "-dest:contentPath=$env:WEBSITE_NAME/,computerName=$computerNameArgument,username=$env:SERVER_USERNAME,password=$env:SERVER_PASSWORD,IncludeAcls=False,AuthType=Basic",
              "-enableRule:AppOffline",
              "-disableLink:AppPoolExtension",
              "-disableLink:ContentExtension",
              "-disableLink:CertificateExtension"
          )

          & $msdeploy $msdeployArguments
          if ($LASTEXITCODE -ne 0) {
              throw "MSDeploy failed with exit code $LASTEXITCODE"
          }

      - name: Verify readiness
        shell: pwsh
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HEALTHCHECK_URL)) {
              Write-Host "HEALTHCHECK_URL is not configured; skipping post-deploy readiness verification."
              exit 0
          }

          $response = Invoke-WebRequest -Uri $env:HEALTHCHECK_URL -UseBasicParsing -TimeoutSec 30
          if ($response.StatusCode -ne 200) {
              throw "Readiness check failed with HTTP $($response.StatusCode)."
          }
