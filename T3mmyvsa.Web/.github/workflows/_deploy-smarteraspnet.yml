name: Deploy to SmarterASP.NET

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: windows-latest
    environment: production
    env:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

      # This shared-hosting deployment example is intentionally SQL Server specific.
      DatabaseSettings__Provider: sqlserver
      DatabaseSettings__ConnectionStringName: appDatabase
      ConnectionStrings__appDatabase: ${{ secrets.DB_CONNECTION_STRING }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore T3mmyvsa.slnx

      - name: Build release
        run: dotnet build T3mmyvsa.slnx --configuration Release --no-restore

      - name: Update database
        run: dotnet run --project Migrations/T3mmyvsa.Migrations.csproj --configuration Release --no-build

      - name: Publish web application
        run: |
          dotnet publish T3mmyvsa.csproj --configuration Release --no-build --output ./release
          Remove-Item -Path ./release/BuildHost-* -Recurse -Force -ErrorAction SilentlyContinue

      - name: Configure shared-host compatibility mode
        shell: pwsh
        run: |
          $webConfigPath = Join-Path $pwd "release\web.config"
          if (-not (Test-Path $webConfigPath)) {
              throw "Published web.config was not found at '$webConfigPath'."
          }

          [xml]$config = Get-Content $webConfigPath
          $aspNetCore = $config.configuration.'system.webServer'.aspNetCore
          if ($null -eq $aspNetCore) {
              throw "Published web.config does not contain the ASP.NET Core IIS handler configuration."
          }

          $environmentVariables = $aspNetCore.environmentVariables
          if ($null -eq $environmentVariables) {
              $environmentVariables = $config.CreateElement("environmentVariables")
              [void]$aspNetCore.AppendChild($environmentVariables)
          }

          function Set-HostedEnvironmentVariable {
              param([string]$Name, [string]$Value)

              $existing = @($environmentVariables.environmentVariable) |
                  Where-Object { $_.name -eq $Name } |
                  Select-Object -First 1

              if ($null -eq $existing) {
                  $node = $config.CreateElement("environmentVariable")
                  [void]$node.SetAttribute("name", $Name)
                  [void]$node.SetAttribute("value", $Value)
                  [void]$environmentVariables.AppendChild($node)
              }
              else {
                  [void]$existing.SetAttribute("value", $Value)
              }
          }

          # SmarterASP.NET shared hosting runs one IIS-managed web process. The
          # dedicated Worker remains the recommended Docker/VPS topology, while
          # shared hosting deliberately processes Hangfire jobs in the API process.
          Set-HostedEnvironmentVariable "ASPNETCORE_ENVIRONMENT" "Production"
          Set-HostedEnvironmentVariable "Hangfire__Enabled" "true"
          Set-HostedEnvironmentVariable "Hangfire__ServerEnabled" "true"

          $config.Save($webConfigPath)

      - name: Deploy to SmarterASP.NET
        shell: pwsh
        env:
          WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $computerNameArgument = "$env:SERVER_COMPUTER_NAME/MsDeploy.axd?site=$env:WEBSITE_NAME"

          $msdeployArguments = @(
              "-verb:sync",
              "-source:contentPath=$pwd/release",
              "-dest:contentPath=$env:WEBSITE_NAME/,computerName=$computerNameArgument,username=$env:SERVER_USERNAME,password=$env:SERVER_PASSWORD,IncludeAcls=False,AuthType=Basic",
              "-enableRule:AppOffline",
              "-disableLink:AppPoolExtension",
              "-disableLink:ContentExtension",
              "-disableLink:CertificateExtension"
          )

          & $msdeploy $msdeployArguments
          if ($LASTEXITCODE -ne 0) {
              throw "MSDeploy failed with exit code $LASTEXITCODE"
          }

      - name: Verify readiness
        shell: pwsh
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HEALTHCHECK_URL)) {
              Write-Host "HEALTHCHECK_URL is not configured; skipping post-deploy readiness verification."
              exit 0
          }

          $response = Invoke-WebRequest -Uri $env:HEALTHCHECK_URL -UseBasicParsing -TimeoutSec 30
          if ($response.StatusCode -ne 200) {
              throw "Readiness check failed with HTTP $($response.StatusCode)."
          }
