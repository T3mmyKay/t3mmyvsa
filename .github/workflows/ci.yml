name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Reject committed package artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files '*.nupkg' '*.snupkg' | grep -q .; then
            echo "NuGet package artifacts must not be committed to source control." >&2
            git ls-files '*.nupkg' '*.snupkg'
            exit 1
          fi

      - name: Validate Docker Compose examples
        working-directory: T3mmyvsa.Web
        shell: bash
        env:
          JWT_SECRET: "CiOnlyDockerValidationSecret_1234567890"
          POSTGRES_PASSWORD: "ci-postgres"
          MSSQL_SA_PASSWORD: "CiOnlySqlServer_Password123!"
          MYSQL_PASSWORD: "ci-mysql"
          MYSQL_ROOT_PASSWORD: "ci-mysql-root"
        run: |
          set -euo pipefail
          for env_file in .env.example docker/env/*.env.example; do
            docker compose --env-file "$env_file" config --quiet
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore T3mmyvsa.slnx

      - name: Build
        run: dotnet build T3mmyvsa.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Unit tests with coverage
        working-directory: T3mmyvsa.Web
        run: >-
          dotnet test Tests/T3mmyvsa.UnitTests/T3mmyvsa.UnitTests.csproj
          -c Release --no-build --no-restore
          --coverage
          --coverage-output TestResults/unit.cobertura.xml
          --coverage-output-format cobertura

      - name: Architecture tests
        working-directory: T3mmyvsa.Web
        run: >-
          dotnet test Tests/T3mmyvsa.ArchitectureTests/T3mmyvsa.ArchitectureTests.csproj
          -c Release --no-build --no-restore

      - name: Integration tests
        working-directory: T3mmyvsa.Web
        run: >-
          dotnet test Tests/T3mmyvsa.IntegrationTests/T3mmyvsa.IntegrationTests.csproj
          -c Release --no-build --no-restore
